<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Front-end error reporting. Inert until a DSN is set in the file itself. -->
  <script src="/error-reporting.js" defer></script>
  <title>Parking Pass</title>
  <!-- reCAPTCHA v3. The site key is a PUBLIC value by design (Google docs
       explicitly state it's safe to expose); security relies only on the
       server-side RECAPTCHA_SECRET_KEY. The key below is a placeholder —
       replace it with the real site key from the Google reCAPTCHA admin
       console. Keep Vercel env RECAPTCHA_SITE_KEY in sync so any future
       build step that injects it matches the hardcoded value.
       TODO: update this constant if you rotate the reCAPTCHA site. -->
  <meta name="recaptcha-site-key" content="6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE">
  <script src="https://www.google.com/recaptcha/api.js?render=6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500,50;9..144,700,50;9..144,800,80;9..144,900,80&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/brand.css">
  <link rel="stylesheet" href="/styles/register.css">
  <style>
    /* Everything shared with resident.html/apt.html moved to
       styles/register.css (Task 17 / FAT-18). What's left here is either
       unique to this page, or a selector list `styles/register.css`
       narrowed to `input`/`input:focus` because resident.html has no
       <select> — this restates the same declarations for <select>,
       which visit.html and apt.html both render. */
    .logo h1 .o-spot {
      display: inline-block;
      width: 0.5em; height: 0.5em;
      border: 3px solid currentColor;
      border-radius: 999px;
      margin: 0 0.04em;
      position: relative;
      top: -0.06em;
    }
    select {
      width: 100%;
      padding: 12px 14px;
      background: var(--paper-2);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: background 0.15s;
      appearance: none;
      cursor: pointer;
    }
    select:focus { background: var(--paper-3); }
    select option { background: var(--paper); color: var(--ink); }
    .validity {
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 14px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    /* Not a failure — the price the server quoted differs from the label the
       payer tapped, and they are being asked to agree to the real one. */
    .notice {
      background: rgba(217,119,6,0.10);
      border: 1.5px solid var(--amber);
      color: var(--ink-2);
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
    }
    .success-plate {
      display: inline-block;
      background: var(--amber-soft);
      border: 1.5px solid var(--ink);
      color: var(--ink);
      padding: 10px 22px;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 18px 0;
    }
    .success-detail {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 8px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    /* Pay-to-park only. Both override the global uppercase <label> styling —
       these labels wrap a control, they aren't field captions. */
    .duration-options { display: grid; gap: 10px; }
    .duration-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 12px 14px;
      background: var(--paper-2);
      border: 1.5px solid var(--ink);
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: normal;
      color: var(--ink);
      cursor: pointer;
    }
    .duration-option input { width: auto; margin: 0; flex: 0 0 auto; accent-color: var(--ink); }
    .ack-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 18px 0 0;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      text-transform: none;
      letter-spacing: normal;
      color: var(--ink-2);
      cursor: pointer;
    }
    .ack-row input { width: auto; margin-top: 2px; flex: 0 0 auto; accent-color: var(--ink); }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="loading-state">Loading the form…</div>
  </div>

  <script type="module" src="/visit.js"></script>
</body>
</html>
