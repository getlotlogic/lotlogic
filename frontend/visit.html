<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parking Pass</title>
  <!-- reCAPTCHA v3. The site key is a PUBLIC value by design (Google docs
       explicitly state it's safe to expose); security relies only on the
       server-side RECAPTCHA_SECRET_KEY. The key below is a placeholder —
       replace it with the real site key from the Google reCAPTCHA admin
       console. Keep Vercel env RECAPTCHA_SITE_KEY in sync so any future
       build step that injects it matches the hardcoded value.
       TODO: update this constant if you rotate the reCAPTCHA site. -->
  <meta name="recaptcha-site-key" content="6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE">
  <script src="https://www.google.com/recaptcha/api.js?render=6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500,50;9..144,700,50;9..144,800,80;9..144,900,80&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F2EAD8;
      --paper-2: #EADFC7;
      --paper-3: #DFD2B5;
      --ink: #1F1B14;
      --ink-2: #3D3528;
      --ink-3: #6F6450;
      --amber: #D97706;
      --amber-soft: #FBBF24;
      --terra: #C97A4A;
      --terra-deep: #9A5530;
      --status-ok: #4A7A48;
      --status-no: #B14535;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -.005em;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(31,27,20,0.025) 0 1.2px, transparent 1.5px),
        radial-gradient(circle at 78% 62%, rgba(31,27,20,0.02) 0 1px, transparent 1.5px),
        radial-gradient(circle at 42% 88%, rgba(31,27,20,0.018) 0 0.8px, transparent 1.2px);
      background-size: 240px 240px, 320px 320px, 200px 200px;
    }
    .card {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo .shield {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-6deg);
      margin-bottom: 12px;
    }
    .logo .shield svg { display: block; }
    .logo h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-variation-settings: "opsz" 144, "wght" 800, "SOFT" 80;
      font-size: 36px;
      letter-spacing: -.02em;
      line-height: 1;
      color: var(--ink);
      text-transform: none;
    }
    .logo h1 span { color: var(--amber); font-style: italic; }
    .logo h1 .o-spot {
      display: inline-block;
      width: 0.5em; height: 0.5em;
      border: 3px solid currentColor;
      border-radius: 999px;
      margin: 0 0.04em;
      position: relative;
      top: -0.06em;
    }
    .property-name {
      text-align: center;
      font-size: 14px;
      color: var(--ink-3);
      margin-bottom: 28px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .property-name strong {
      display: block;
      font-family: 'Fraunces', serif;
      font-variation-settings: "opsz" 144, "wght" 700, "SOFT" 80;
      font-style: italic;
      font-size: 22px;
      color: var(--ink);
      margin-top: 6px;
      letter-spacing: -.01em;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      margin-bottom: 6px;
      margin-top: 16px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    label .required { color: var(--status-no); margin-left: 2px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: var(--paper-2);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: background 0.15s;
    }
    input:focus, select:focus { background: var(--paper-3); }
    input::placeholder { color: var(--ink-3); }
    select { appearance: none; cursor: pointer; }
    select option { background: var(--paper); color: var(--ink); }
    .plate-input {
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 22px;
      text-align: center;
      font-family: 'DM Mono', ui-monospace, monospace;
      background: var(--amber-soft);
    }
    .plate-input:focus { background: var(--amber-soft); }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 24px;
      font-family: inherit;
      transition: background 0.15s;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .submit-btn:hover:not(:disabled) { background: var(--terra-deep); border-color: var(--terra-deep); }
    .validity {
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 14px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .error {
      background: rgba(177,69,53,0.12);
      border: 1.5px solid var(--status-no);
      color: var(--status-no);
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
    }
    .success-card { text-align: center; }
    .success-icon {
      width: 64px;
      height: 64px;
      border: 2px solid var(--status-ok);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .success-icon svg { width: 32px; height: 32px; stroke: var(--status-ok); fill: none; stroke-width: 2.5; }
    .success-card h2 {
      font-family: 'Fraunces', serif;
      font-variation-settings: "opsz" 144, "wght" 800, "SOFT" 80;
      font-size: 28px;
      letter-spacing: -.015em;
      color: var(--ink);
      margin-bottom: 10px;
      line-height: 1.05;
    }
    .success-card h2 em { font-style: italic; color: var(--amber); }
    .success-card p { font-size: 15px; color: var(--ink-2); line-height: 1.55; }
    .success-card p em {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-variation-settings: "opsz" 14, "wght" 600, "SOFT" 50;
    }
    .success-plate {
      display: inline-block;
      background: var(--amber-soft);
      border: 1.5px solid var(--ink);
      color: var(--ink);
      padding: 10px 22px;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 18px 0;
    }
    .success-detail {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 8px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .loading-state {
      text-align: center;
      padding: 40px 0;
      color: var(--ink-3);
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-variation-settings: "opsz" 14, "wght" 500, "SOFT" 50;
      font-size: 16px;
    }
    .not-found { text-align: center; padding: 20px 0; }
    .not-found h2 {
      font-family: 'Fraunces', serif;
      font-variation-settings: "opsz" 144, "wght" 800, "SOFT" 80;
      font-size: 22px;
      color: var(--status-no);
      margin-bottom: 10px;
      letter-spacing: -.01em;
    }
    .not-found p { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
    /* Pay-to-park only. Both override the global uppercase <label> styling —
       these labels wrap a control, they aren't field captions. */
    .duration-options { display: grid; gap: 10px; }
    .duration-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 12px 14px;
      background: var(--paper-2);
      border: 1.5px solid var(--ink);
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: normal;
      color: var(--ink);
      cursor: pointer;
    }
    .duration-option input { width: auto; margin: 0; flex: 0 0 auto; accent-color: var(--ink); }
    .ack-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 18px 0 0;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      text-transform: none;
      letter-spacing: normal;
      color: var(--ink-2);
      cursor: pointer;
    }
    .ack-row input { width: auto; margin-top: 2px; flex: 0 0 auto; accent-color: var(--ink); }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="loading-state">Loading the form…</div>
  </div>

  <script>
    // Raw fetch against Supabase PostgREST + Storage. Dropping supabase-js here
    // because its createClient() auto-opens a realtime WebSocket that can hang
    // on strict networks / extensions and leave the page stuck on "Loading...".
    const SUPABASE_URL = 'https://nzdkoouoaedbbccraoti.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZGtvb3VvYWVkYmJjY3Jhb3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMzg2OTQsImV4cCI6MjA4ODcxNDY5NH0.WrlTCKEmmziBUX1E9vBmBpHRSg7_RRKBLIxSPKy189E';
    // Backend base. Used for endpoints that anon role can't read directly
    // (e.g. /visitor_passes/check-active — RLS blocks anon SELECT on
    // visitor_passes, so the QR form's pre-flight duplicate-pass check
    // MUST go through the backend's public, minimal-response endpoint).
    const BACKEND_URL = 'https://lotlogic-backend-production.up.railway.app';

    // reCAPTCHA v3 site key. Public value — Google explicitly documents
    // that the site key is meant to be exposed; security relies only on
    // the server-side RECAPTCHA_SECRET_KEY. Mirrored in the <meta> tag in
    // <head> so any future build step that does token replacement has
    // exactly one place to patch.
    const RECAPTCHA_SITE_KEY =
      (document.querySelector('meta[name=recaptcha-site-key]')?.content)
      || '6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE';

    // Fetch a fresh reCAPTCHA v3 token for the given action. Returns null
    // on script-load failure so the caller can decide whether to hard-fail
    // or continue (we hard-fail on submit — Intuit requires a valid token).
    async function getRecaptchaToken(action) {
      if (!window.grecaptcha || typeof grecaptcha.ready !== 'function') {
        return null;
      }
      return new Promise((resolve, reject) => {
        try {
          grecaptcha.ready(() => {
            grecaptcha.execute(RECAPTCHA_SITE_KEY, { action }).then(resolve, reject);
          });
        } catch (err) {
          reject(err);
        }
      });
    }

    async function pgRest(path, init = {}, timeoutMs = 10000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1' + path, {
          ...init,
          signal: ctrl.signal,
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            ...(init.headers || {}),
          },
        });
        const text = await res.text();
        const body = text ? JSON.parse(text) : null;
        if (!res.ok) {
          const err = new Error((body && body.message) || ('HTTP ' + res.status));
          err.code = body && body.code;
          err.details = body && body.details;
          err.status = res.status;
          throw err;
        }
        return body;
      } finally { clearTimeout(t); }
    }

    const app = document.getElementById('app');

    // QR code id comes from /visit.html/<qr> in the URL, but we also accept
    // ?qr=<id> so a shared / emailed link like /visit.html?qr=... still works.
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const qrCodeId = (pathParts.length >= 2 ? pathParts[pathParts.length - 1] : null)
      || new URLSearchParams(window.location.search).get('qr');

    // Square sends the payer back to ?qr=<id>&plaza_payment_id=<uuid>. Its
    // presence means "we just came back from checkout" — never that anything
    // was paid. The status poll below is the only source of that truth.
    const plazaPaymentId = new URLSearchParams(window.location.search).get('plaza_payment_id');

    let property = null;

    async function init() {
      if (!qrCodeId) {
        showNotFound('Invalid Link', 'This parking pass link is not valid.');
        return;
      }
      try {
        const rows = await loadPropertyRow();
        const data = Array.isArray(rows) ? rows[0] : null;
        if (!data) {
          showNotFound('Lot Not Found', 'This parking pass link is not valid or has expired.');
          return;
        }
        property = data;
        if (plazaPaymentId && property.property_type === 'truck_plaza') {
          handlePlazaReturn(plazaPaymentId);
          return;
        }
        showForm();
      } catch (err) {
        console.error('init error:', err);
        showConnectionError(err);
      }
    }

    // Columns every deploy of this page can read. `pay_to_park_enabled` is
    // asked for separately because the anon column grants may not include it
    // yet — an older DB answers the wider select with a 4xx, and a page that
    // died there would take the FREE form down with it. So: ask wide, and on
    // any HTTP error re-ask narrow and treat the flag as off.
    const PROPERTY_COLUMNS = 'id,name,address,property_type,policy_text,policy_phone';

    function propertyQuery(columns) {
      return `/properties?select=${columns}&qr_code_id=eq.${encodeURIComponent(qrCodeId)}&limit=1`;
    }

    async function loadPropertyRow() {
      try {
        return await pgRest(propertyQuery(PROPERTY_COLUMNS + ',pay_to_park_enabled'));
      } catch (err) {
        if (!err || !err.status) throw err;   // timeout / network — not a column problem
        console.warn('pay_to_park_enabled unreadable — falling back to free registration:', err.message);
        return await pgRest(propertyQuery(PROPERTY_COLUMNS));
      }
    }

    // The single gate for every paid-only behaviour on this page.
    function payToParkOn() {
      return !!property
        && property.property_type === 'truck_plaza'
        && property.pay_to_park_enabled === true;
    }

    function showConnectionError(err) {
      const detail = err && (err.name === 'AbortError' ? 'Request timed out.' : (err.message || 'Network error.'));
      app.innerHTML = `
        <div class="logo"><div class="shield"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F1B14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 10h2a2 2 0 0 1 0 4H9zm0 0v4"/></svg></div><h1>LotL<span>o</span>gic</h1></div>
        <div class="not-found">
          <h2>Can't reach our server.</h2>
          <p>${escapeHtml(detail)}</p>
          <p>Check your connection — then give it another go.</p>
          <button id="retryBtn" class="submit-btn" style="margin-top:18px">Try again →</button>
        </div>
      `;
      const btn = document.getElementById('retryBtn');
      if (btn) btn.addEventListener('click', () => {
        app.innerHTML = '<div class="loading-state">Loading the form…</div>';
        init();
      });
    }

    function showNotFound(title, message) {
      app.innerHTML = `
        <div class="logo">
          <div class="shield"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F1B14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 10h2a2 2 0 0 1 0 4H9zm0 0v4"/></svg></div>
          <h1>LotL<span>o</span>gic</h1>
        </div>
        <div class="not-found">
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(message)}</p>
        </div>
      `;
    }

    // Form-mount idempotency key — same key reused on every retry of the same form.
    let idempotencyKey = null;
    function newIdempotencyKey() {
      idempotencyKey = (crypto.randomUUID && crypto.randomUUID()) ||
        (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));
    }

    // Drivers helpfully append the plate's state/province — "PB36041 ON",
    // "3874552 NC", "P886417 ONTARIO". The camera never reads a state suffix,
    // so a stored suffix makes the plate permanently unmatchable (observed in
    // production: PB36041ON registered, then re-registered correctly 20 min
    // later). Strip standalone trailing region tokens from the RAW input,
    // BEFORE separator-stripping destroys the token boundary — a legit plate
    // that merely ENDS in "NC" with no space is never touched.
    const REGION_TOKENS = new Set((
      'AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC ' +
      'AB BC MB NB NL NS NT NU ON PE QC SK YT ' +
      'ALABAMA ALASKA ARIZONA ARKANSAS CALIFORNIA COLORADO CONNECTICUT DELAWARE FLORIDA GEORGIA HAWAII IDAHO ILLINOIS INDIANA IOWA KANSAS KENTUCKY LOUISIANA MAINE MARYLAND MASSACHUSETTS MICHIGAN MINNESOTA MISSISSIPPI MISSOURI MONTANA NEBRASKA NEVADA OHIO OKLAHOMA OREGON PENNSYLVANIA TENNESSEE TEXAS UTAH VERMONT VIRGINIA WASHINGTON WISCONSIN WYOMING ' +
      'ONTARIO QUEBEC ALBERTA SASKATCHEWAN MANITOBA YUKON'
    ).split(' '));
    // Two-word regions checked as a joined pair below.
    ['NEW HAMPSHIRE','NEW JERSEY','NEW MEXICO','NEW YORK','NORTH CAROLINA','NORTH DAKOTA','SOUTH CAROLINA','SOUTH DAKOTA','RHODE ISLAND','WEST VIRGINIA','NOVA SCOTIA','NEW BRUNSWICK','BRITISH COLUMBIA','PRINCE EDWARD','NORTHWEST TERRITORIES'].forEach(r => REGION_TOKENS.add(r));

    function normalizePlate(s) {
      let tokens = String(s || '').trim().toUpperCase().split(/[\s,.\-\/]+/).filter(Boolean);
      let changed = true;
      // tokens.length > 1 guard: never strip the entry down to nothing — a
      // back plate typed as just "SD" survives here and is rejected by
      // validation instead ("that looks like a state, not a plate").
      while (changed && tokens.length > 1) {
        changed = false;
        const last = tokens[tokens.length - 1];
        const lastTwo = tokens.length > 2 ? tokens[tokens.length - 2] + ' ' + last : null;
        if (lastTwo && REGION_TOKENS.has(lastTwo)) { tokens.pop(); tokens.pop(); changed = true; }
        else if (REGION_TOKENS.has(last)) { tokens.pop(); changed = true; }
      }
      return tokens.join('').replace(/[^A-Z0-9]/g, '');
    }
    function normalizePhone(s) {
      const digits = (s || '').replace(/\D/g, '');
      if (digits.length === 10) return '+1' + digits;
      if (digits.length === 11 && digits.startsWith('1')) return '+' + digits;
      if (digits.startsWith('+')) return s;
      return digits ? ('+' + digits) : '';
    }

    const DEFAULT_TRUCK_PLAZA_POLICY = `TRUCK PARKING POLICIES

1. DROPPED TRAILERS
No dropped trailers.

2. DESIGNATED PARKING ONLY
Parking is permitted only in designated parking spaces. Parking is prohibited in the following areas:
• Beside the store
• Around the CAT Scale
• Around the gas drop location
• Beside the diesel drop location
• Beside the white air hose building
• Parallel to the driveway
• Blocking trash dumpsters
• Employee parking areas (Employee Parking Only)

3. NO CONSECUTIVE PARKING AFTER 48 HOURS
Trucks registered for 24–48 hours must vacate the property after their stay. Once you leave the premises, you must wait at least 24 hours before returning to park. NO EXCEPTIONS.

4. VEHICLE WASHING
Trailer or truck washing is prohibited on the property.

5. PERSONAL VEHICLES
Personal vehicles are not permitted in truck parking or employee parking areas.

6. DIESEL FUEL ISLAND
Sleeping on the diesel fuel island is prohibited.

7. TRUCK REGISTRATION REQUIREMENT
All trucks must enter their full license plate number and full company name when checking in. Failure to provide complete and accurate information will be considered a violation of these parking policies. Trucks with incomplete or incorrect registration information are subject to immediate towing at the owner's expense.

TOWING ENFORCED
Violation of any of the above parking policies will result in towing at the vehicle owner's expense. Property management has authorized the property's tow operator to enforce these parking policies.

LIABILITY NOTICE
The property and tow operator are not liable for any damage to trucks, trailers, or personal vehicles occurring on the property or resulting from towing. By registering, you agree to follow all parking policies and understand this liability notice.`;

    function showForm() {
      newIdempotencyKey();
      if (property.property_type === 'truck_plaza') {
        showTruckPlazaForm();
      } else {
        showApartmentForm();
      }
    }

    function showApartmentForm() {
      app.innerHTML = `
        <div class="logo">
          <div class="shield"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F1B14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 10h2a2 2 0 0 1 0 4H9zm0 0v4"/></svg></div>
          <h1>LotL<span>o</span>gic</h1>
        </div>
        <div class="property-name">
          parking pass at
          <strong>${escapeHtml(property.name)}</strong>
        </div>
        <form id="passForm">
          <label for="visitorName">Full Name <span class="required">*</span></label>
          <input type="text" id="visitorName" placeholder="Jane Smith" required>

          <label for="phone">Phone Number <span class="required">*</span></label>
          <input type="tel" id="phone" placeholder="(555) 123-4567" required>

          <label for="plate">License Plate <span class="required">*</span></label>
          <input type="text" id="plate" class="plate-input" placeholder="ABC 1234" required maxlength="10" autocomplete="off">
          <div style="font-size:12px;opacity:.65;margin-top:4px;">Plate characters only — no state or province</div>

          <label for="backPlate">Back License Plate <span style="opacity:.7;font-weight:normal;">(if different)</span></label>
          <input type="text" id="backPlate" class="plate-input" placeholder="leave blank if same" maxlength="10" autocomplete="off">
          <div style="font-size:12px;opacity:.65;margin-top:4px;">Plate characters only — no state or province</div>

    async function preflightCheckPlate() {
      const msg = document.getElementById('preflightMsg');
      msg.textContent = '';
      const plate = normalizePlate(document.getElementById('plate').value);
      if (!plate || plate.length < 2) return;
      try {
        // Pre-flight the duplicate-pass warning via the backend's public
        // /visitor_passes/check-active endpoint. Reading visitor_passes
        // directly from PostgREST returns [] under the anon role (no SELECT
        // policy), so the old direct-query path was silently useless — a
        // driver re-scanning the QR after a few hours would never see the
        // "already registered" notice. The backend endpoint is public, in
        // PUBLIC_PATHS, and returns only {active, valid_until, reference_id}.
        const url = `${BACKEND_URL}/visitor_passes/check-active`
          + `?property_id=${encodeURIComponent(property.id)}`
          + `&plate=${encodeURIComponent(plate)}`;
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 10000);
        let data = null;
        try {
          const res = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
          if (res.ok) {
            const text = await res.text();
            data = text ? JSON.parse(text) : null;
          }
        } finally { clearTimeout(t); }
        if (data && data.held && data.hold_until) {
          const until = new Date(data.hold_until).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
          // Cooldown is advisory-only as of 2026-05-31 — the DB trigger no
          // longer blocks re-registration. Wording softened so drivers
          // don't think they're blocked and bail (in case they are
          // re-registering for a legitimate reason).
          msg.textContent = `Heads up — this plate was registered recently. You can still register; the property will see this flag and may follow up.`;
          msg.style.color = '#b45309';
        } else if (data && data.active && data.valid_until) {
          const expires = new Date(data.valid_until).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
          const ref = (data.reference_id || '').toString().toUpperCase();
          msg.textContent = ref
            ? `Already registered: pass active until ${expires} (Ref ${ref})`
            : `Already registered: pass active until ${expires}`;
          msg.style.color = '';
        } else {
          msg.style.color = '';
        }
      } catch (_) { /* non-fatal — let submit handle it */ }
    }

    // ── Backend register helper ────────────────────────────────────────
    // POST to one of the public /register endpoints. Normalizes errors so
    // the handlers above can dispatch on err.status and err.message.
    // reCAPTCHA rejects come back as 400 with detail "recaptcha:<reason>";
    // we surface a single friendly string to the user and rely on the
    // server-side log for the real reason (never log the token here).
    async function backendRegister(path, payload, timeoutMs = 12000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(BACKEND_URL + path, {
          method: 'POST',
          signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload),
        });
        const text = await res.text();
        const body = text ? JSON.parse(text) : null;
        if (!res.ok) {
          const detail = body && (body.detail || body.message);
          const err = new Error(typeof detail === 'string' ? detail : ('HTTP ' + res.status));
          err.status = res.status;
          err.detail = detail;
          throw err;
        }
        return body;
      } finally { clearTimeout(t); }
    }

    // Translate a backend error into a message the driver should see.
    // reCAPTCHA failures → generic retry message (don't leak the reason).
    function friendlyErrorMessage(err) {
      const msg = (err && err.message) || '';
      if (msg.startsWith('recaptcha:') || /automated-access check failed/i.test(msg)) {
        return 'Please retry — automated-access check failed.';
      }
      if (err && err.name === 'AbortError') {
        return 'Request timed out. Please try again.';
      }
      return msg || 'Something went wrong. Please try again.';
    }

    function showSuccess(opts) {

          Save this page (screenshot or bookmark) as your registration receipt.

      app.innerHTML = `

    // ── Pay-to-park (truck plaza) ──────────────────────────────────────
    // Everything below runs only when properties.pay_to_park_enabled is true.
    // The free registration path never reaches any of it.

    // A stable fingerprint of what the payer typed. The idempotency key is
    // keyed off this, so a retry of the SAME form reuses the SAME key (one
    // Square order, one charge), while an edited form gets a fresh one.
    function plazaFormSig(parts) {
      const str = parts.join('|');
      let h1 = 5381, h2 = 52711;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = (((h1 << 5) + h1) + c) >>> 0;
        h2 = (((h2 << 5) + h2) ^ c) >>> 0;
      }
      return h1.toString(36) + h2.toString(36);
    }

    // §13.6 — survives the full-page redirect to Square and any reload.
    // sessionStorage, not a module variable: the page is destroyed and rebuilt
    // by the round-trip, and a second key would mean a second order.
    function plazaIdempotencyKey(formSig) {
      const k = 'plaza_idem_' + formSig;
      let v = null;
      try { v = sessionStorage.getItem(k); } catch (e) {}
      if (!v) {
        v = (crypto.randomUUID && crypto.randomUUID()) ||
            (Date.now() + '-' + Math.random().toString(36).slice(2));
        try { sessionStorage.setItem(k, v); } catch (e) {}
      }
      return v;
    }

    // Drop a key the server has told us is spent. The next submit mints a new
    // one — reusing a settled key just gets refused again.
    function plazaForgetIdempotencyKey(formSig) {
      try { sessionStorage.removeItem('plaza_idem_' + formSig); } catch (e) {}
    }

    // Every key this browser session minted for this page. Cleared once a pass
    // is confirmed active, so the next stay starts clean.
    function plazaClearIdempotencyKeys() {
      try {
        for (let i = sessionStorage.length - 1; i >= 0; i--) {
          const k = sessionStorage.key(i);
          if (k && k.indexOf('plaza_idem_') === 0) sessionStorage.removeItem(k);
        }
      } catch (e) {}
    }

    // A 409 on the idempotency key comes in two flavours and they are NOT
    // interchangeable. `paid` / `refunded` mean money already changed hands
    // for this exact stay: reminting the key there would hand the payer a
    // second Square checkout for a stay they already bought, and this product
    // issues no refunds. Every other spent-key code means no charge was made,
    // so a fresh key is the right recovery.
    function plazaSpentKeyKind(detail) {
      const d = typeof detail === 'string' ? detail : '';
      if (d === 'quote_already_settled:paid' || d === 'quote_already_settled:refunded') return 'paid';
      if (d === 'idempotency_key_reuse_mismatch' || d === 'duplicate_quote' ||
          d.indexOf('quote_already_settled:') === 0) return 'retry';
      return null;
    }

    // Plain language for every refusal the payment entrance can answer with.
    // Raw JSON and internal codes never reach the payer.
    function plazaPayErrorMessage(status, detail) {
      const d = typeof detail === 'string' ? detail : '';
      if (status === 429) {
        return 'Too many attempts in the last hour — please wait a bit and try again.';
      }
      if (status === 502 || status === 503) {
        return 'Payments are unavailable right now. Please try again in a few minutes.';
      }
      if (status === 409) {
        const kind = plazaSpentKeyKind(d);
        if (kind === 'paid') {
          return 'This stay has already been paid for. Do not pay again — reload this page to see your pass status.';
        }
        if (kind === 'retry') {
          return 'That payment attempt has already been used. Please try again.';
        }
        return d || 'We could not start the payment. Please try again.';
      }
      if (status === 400) {
        if (d.indexOf('recaptcha:') === 0) return 'Please retry — automated-access check failed.';
        if (d === 'policy_not_acknowledged') return 'Please tick the box above to continue.';
        if (d === 'plate_invalid') return 'Please enter a valid license plate number.';
        return d || 'We could not start the payment. Please try again.';
      }
      if (status === 404) return 'This parking pass link is not valid.';
      return 'Something went wrong. Please try again.';
    }

    async function handlePlazaPaySubmit(e) {
      e.preventDefault();
      if (submitting) return;
      submitting = true;
      const btn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('errorMsg');

      let formSig = null;
      try {
        const companyName = document.getElementById('companyName').value.trim();
        const operatorName = document.getElementById('driverName').value.trim();
        const plateText = normalizePlate(document.getElementById('plate').value);
        const backPlateRaw = document.getElementById('backPlate')?.value || '';
        const backPlateText = backPlateRaw.trim() ? normalizePlate(backPlateRaw) : null;
        const phone = normalizePhone(document.getElementById('phone').value);
        const durationEl = document.querySelector('input[name="duration"]:checked');
        const duration = durationEl ? durationEl.value : '';
        const acknowledged = !!document.getElementById('payAck')?.checked;

        if (!companyName) throw new Error('Company name is required.');
        if (!operatorName) throw new Error('Operator name is required.');
        if (!plateText || plateText.length < 2) throw new Error('Please enter a valid license plate number.');
        if (REGION_TOKENS.has(plateText)) throw new Error('That looks like a state, not a plate — enter the plate characters only.');
        if (!backPlateText) throw new Error('Please enter the trailer / rear plate. If your truck has only one plate, enter it again.');
        if (REGION_TOKENS.has(backPlateText)) throw new Error('The trailer plate looks like a state name, not a plate — enter the plate characters only.');
        if (backPlateText.length < 2) throw new Error('Please enter a valid trailer / rear plate.');
        if (!phone || phone.length < 11) throw new Error('Please enter a valid phone number.');
        if (duration !== 'h24' && duration !== 'h48') throw new Error('Choose 24 or 48 hours.');
        if (!acknowledged) throw new Error('Please tick the box above to continue.');

        const recaptchaToken = await getRecaptchaToken('plaza_pay').catch(() => null);
        if (!recaptchaToken) throw new Error('Please retry — automated-access check failed.');

        formSig = plazaFormSig([plateText, backPlateText, phone, companyName, operatorName, duration]);
        const idemKey = plazaIdempotencyKey(formSig);

        // The body carries a duration ENUM and never an amount: the price is
        // the server's to decide (§13.2).
        const data = await backendRegister('/plaza/quote-and-start', {
          property_id: property.id,
          duration: duration,
          plate_text: plateText,
          back_plate: backPlateText,
          phone: phone,
          company_name: companyName,
          visitor_name: operatorName,
          policy_acknowledged: true,
          idempotency_key: idemKey,
          recaptcha_token: recaptchaToken,
        });

        if (!data || !data.checkout_url) throw new Error('Could not start payment. Please try again.');
        window.location.href = data.checkout_url;
        return;   // leaving the page — keep the button disabled
      } catch (err) {
        const status = err && err.status;
        const detail = err && (err.detail || err.message);
        const spent = status === 409 ? plazaSpentKeyKind(detail) : null;
        if (spent === 'retry' && formSig) {
          // No charge was made under this key. Mint a fresh one next time —
          // the server refuses a spent key forever.
          plazaForgetIdempotencyKey(formSig);
        }
        const message = status
          ? plazaPayErrorMessage(status, detail)
          : friendlyErrorMessage(err);
        errorDiv.innerHTML = '<div class="error">' + escapeHtml(message) + '</div>';
        btn.innerHTML = 'Pay &amp; register →';
        if (spent === 'paid') {
          // Terminal. The stay is bought; the only thing another tap could buy
          // is a second one. Keep the key, keep the form shut — `submitting`
          // stays true so even an Enter keypress cannot re-submit.
          btn.disabled = true;
          const ackBox = document.getElementById('payAck');
          if (ackBox) ackBox.disabled = true;
          return;
        }
        btn.disabled = !document.getElementById('payAck')?.checked;
        submitting = false;
      }
    }

    // ── Return from Square (§13.11) ────────────────────────────────────
    // "Paid" is never painted from the query string. Square redirects the
    // moment the card clears; the pass is created by the webhook, so the page
    // polls the server until it sees a live pass.
    // One poll. Answers with {status: 200|404|null, body} so the caller can
    // tell "the server said pending" apart from "we never reached the server"
    // — those two must not end on the same reassuring copy. Bounded like every
    // other fetch on this page: a hung request would otherwise eat the whole
    // polling window in one go.
    async function plazaFetchStatus(ppId, timeoutMs = 4000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(
          BACKEND_URL + '/plaza/payments/' + encodeURIComponent(ppId) + '/status',
          { signal: ctrl.signal, headers: { Accept: 'application/json' } },
        );
        if (res.status === 404) return { status: 404, body: null };
        if (!res.ok) return { status: res.status, body: null };
        const text = await res.text();
        return { status: 200, body: text ? JSON.parse(text) : null };
      } catch (e) {
        return { status: null, body: null };   // timeout / offline
      } finally { clearTimeout(t); }
    }

    async function handlePlazaReturn(ppId) {
      showPlazaMessage('Confirming your payment…');
      let heardFromServer = false;
      for (let i = 0; i < 10; i++) {            // ~20s
        const r = await plazaFetchStatus(ppId);
        if (r.status === 404) {
          // The id is not ours. Never tell someone their payment is fine when
          // we cannot find a record of it.
          showPlazaUnknown();
          return;
        }
        if (r.status === 200) {
          heardFromServer = true;
          const s = r.body;
          if (s && s.pass_active) {
            plazaClearIdempotencyKeys();
            showPlazaPaidSuccess();
            return;
          }
          if (s && s.payment_status === 'failed') {
            showPlazaFailed();
            return;
          }
        }
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
      // The server said "not yet" — a webhook still in flight. Reassurance earned.
      if (heardFromServer) {
        showPlazaMessage(
          "Payment received — your parking pass is being activated. Keep this " +
          "page as your receipt; Square will also email or text you a receipt " +
          "if you entered your contact info at checkout."
        );
        return;
      }
      // We never got an answer, so we know nothing about the money. Say so.
      showPlazaMessage(
        "We couldn't reach the server to confirm your payment. If you were " +
        "charged, your parking pass is being activated; reload this page in a " +
        "minute to confirm."
      );
    }

    function plazaLogoHtml() {
      return `
        <div class="logo">
          <div class="shield"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F1B14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 10h2a2 2 0 0 1 0 4H9zm0 0v4"/></svg></div>
          <h1>LotL<span>o</span>gic</h1>
        </div>`;
    }

    function showPlazaMessage(message) {
      app.innerHTML = plazaLogoHtml() + `
        <div class="loading-state" id="plazaStatus">${escapeHtml(message)}</div>
      `;
    }

    function showPlazaPaidSuccess() {
      app.innerHTML = `
        <div class="success-card">
          <div class="success-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h2>You're <em>registered.</em></h2>
          <p id="plazaPaidCopy">Payment received. Your parking pass is active.</p>
          <div class="success-detail" style="margin-top:14px;">Pass for ${escapeHtml(property && property.name || '')}.</div>
          <div class="success-detail" style="margin-top:14px;color:#6b7280;font-size:12px;">
            Save this page (screenshot or bookmark) as your registration receipt.
          </div>
        </div>
      `;
    }

    function showPlazaUnknown() {
      app.innerHTML = plazaLogoHtml() + `
        <div class="not-found">
          <h2 id="plazaUnknown">We can't find that payment.</h2>
          <p>If you were charged, reload this page in a minute — or contact the plaza.</p>
        </div>
      `;
    }

    function showPlazaFailed() {
      app.innerHTML = plazaLogoHtml() + `
        <div class="not-found">
          <h2 id="plazaFailed">Payment did not go through.</h2>
          <p>The payment did not complete, so no parking pass was created.</p>
          <p>Scan the code again to retry.</p>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
