name: Frontend build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` from the committed lockfile: a broken lockfile fails the build
      # rather than floating onto a different esbuild.
      - run: npm ci
      # This IS the syntax check the frontend has never had (FE-3). A typo in
      # dashboard.html now fails here instead of white-screening production.
      - run: npm run build
      - name: Report bundle size
        run: |
          set -eu
          raw=$(wc -c < dist/dashboard.js)
          gz=$(gzip -9 -c dist/dashboard.js | wc -c)
          echo "dashboard.js  raw=${raw}  gzip=${gz}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist-${{ github.run_id }}
          path: |
            frontend/dist/dashboard.js
            frontend/dist/metafile.json
          retention-days: 7
