name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history scan needs the full graph

      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Advisory for now (Ruling R29-8) — the working tree today finds 13-16
      # findings here, almost all of them the camera MACs Wave 2.9 Task 4 is
      # scoped to remove (see task-5-report.md). Task 4's PR is the change
      # that flips this back to blocking: drop the `continue-on-error: true`
      # line below once Task 4 has landed and this step is clean.
      - name: Scan the working tree
        id: working_tree_scan
        continue-on-error: true
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1 --verbose

      - name: Warn on working-tree findings
        if: steps.working_tree_scan.outcome == 'failure'
        run: echo "::warning::gitleaks found secret-shaped strings in the working tree. This step is advisory until Wave 2.9 Task 4 lands (see .github/workflows/secrets-scan.yml and task-5-report.md) — see the 'Scan the working tree' step above for the findings."

      # Advisory for now — git history still holds the camera keys Task 4 removed
      # from the tree, and rewriting history is a separate decision (D5). Flip
      # continue-on-error off once that is settled.
      - name: Scan git history (advisory)
        continue-on-error: true
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose
