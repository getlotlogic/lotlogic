<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Front-end error reporting. Inert until a DSN is set in the file itself. -->
  <script src="/error-reporting.js" defer></script>
  <title>Parking Pass Request</title>
  <!-- reCAPTCHA v3. The site key is a PUBLIC value by design; security
       relies only on the server-side RECAPTCHA_SECRET_KEY. The placeholder
       below must be replaced with the real site key from the Google
       reCAPTCHA admin console. Keep Vercel env RECAPTCHA_SITE_KEY in sync.
       TODO: update this constant if you rotate the reCAPTCHA site. -->
  <meta name="recaptcha-site-key" content="6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE">
  <script src="https://www.google.com/recaptcha/api.js?render=6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500,50;9..144,700,50;9..144,800,80;9..144,900,80&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/brand.css">
  <link rel="stylesheet" href="/styles/register.css">
  <style>
    /* Everything shared with visit.html/apt.html moved to
       styles/register.css (Task 17 / FAT-18). What's left is unique to
       this page (or the .o-spot rule below, which is dead CSS — no markup
       on this page ever carries that class — carried over unchanged from
       before the split). */
    .logo h1 .o-spot {
      display: inline-block;
      width: 0.5em; height: 0.5em;
      border: 3px solid currentColor;
      border-radius: 999px;
      margin: 0 0.04em;
      position: relative;
      top: -0.06em;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 14px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .success-plate {
      display: inline-block;
      background: var(--amber-soft);
      border: 1.5px solid var(--ink);
      color: var(--ink);
      padding: 10px 22px;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 18px 0;
    }
    .success-detail {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 8px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .pending-badge {
      display: inline-block;
      background: var(--paper-2);
      border: 1.5px solid var(--amber);
      color: var(--amber);
      padding: 8px 16px;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="loading-state">Loading the form…</div>
  </div>

  <script type="module" src="/resident.js"></script>
</body>
</html>
