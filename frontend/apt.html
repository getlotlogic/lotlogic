<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Front-end error reporting. Inert until a DSN is set in the file itself. -->
  <script src="/error-reporting.js" defer></script>
  <title>Parking Registration</title>
  <!-- reCAPTCHA v3. The site key is a PUBLIC value by design; security relies
       only on the server-side RECAPTCHA_SECRET_KEY. Keep Vercel env
       RECAPTCHA_SITE_KEY in sync with the value below.
       TODO: update this constant if you rotate the reCAPTCHA site. -->
  <meta name="recaptcha-site-key" content="6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE">
  <script src="https://www.google.com/recaptcha/api.js?render=6LdaAb4sAAAAACd5g-pYqnQBWHdvMmGCufwtEQnE" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500,50;9..144,700,50;9..144,800,80;9..144,900,80&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/brand.css">
  <link rel="stylesheet" href="/styles/register.css">
  <style>
    /* Everything shared with visit.html/resident.html moved to
       styles/register.css (Task 17 / FAT-18). What's left here is either
       unique to this page, or a selector list styles/register.css narrowed
       to `input`/`input:focus` because resident.html has no <select> — this
       restates the same declarations for <select>, which apt.html and
       visit.html both render. */
    label .optional { opacity: .7; font-weight: normal; text-transform: none; letter-spacing: 0; }
    select {
      width: 100%;
      padding: 12px 14px;
      background: var(--paper-2);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: background 0.15s;
      appearance: none;
      cursor: pointer;
    }
    select:focus { background: var(--paper-3); }
    select option { background: var(--paper); color: var(--ink); }
    input[type=file] {
      padding: 10px 12px;
      font-size: 13px;
      font-family: 'DM Mono', ui-monospace, monospace;
      cursor: pointer;
    }
    input[type=file]::file-selector-button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      margin-right: 12px;
      cursor: pointer;
    }
    .choice-btn {
      width: 100%;
      padding: 18px 16px;
      background: var(--paper-2);
      color: var(--ink);
      border: 1.5px solid var(--ink);
      border-radius: 0;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      font-family: inherit;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }
    .choice-btn:hover { background: var(--paper-3); }
    .choice-btn .sub { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); margin-top: 4px; font-family: 'DM Mono', ui-monospace, monospace; letter-spacing: .02em; }
    .choice-btn .arrow { font-size: 22px; color: var(--amber); }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      background: none;
      border: none;
      color: var(--ink-3);
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: .04em;
      cursor: pointer;
      text-decoration: underline;
    }
    .file-hint {
      font-size: 11px;
      color: var(--ink-3);
      margin-top: 4px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .02em;
    }
    .vehicle-block {
      border: 1.5px dashed var(--ink-3);
      padding: 14px 16px 18px;
      margin-top: 16px;
    }
    .vehicle-block .vehicle-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .vehicle-block .remove-vehicle {
      background: none;
      border: none;
      color: var(--status-no);
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }
    .add-vehicle-btn {
      width: 100%;
      padding: 11px;
      background: none;
      color: var(--ink);
      border: 1.5px dashed var(--ink);
      border-radius: 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .add-vehicle-btn:hover { background: var(--paper-2); }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 14px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 18px;
      cursor: pointer;
    }
    .check-row input[type=checkbox] {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      margin: 0;
      padding: 0;
      accent-color: var(--ink);
      cursor: pointer;
    }
    .check-row .check-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      margin: 0;
      text-transform: none;
      letter-spacing: 0;
      font-family: inherit;
    }
    .temp-tag-detail { margin-top: 4px; }
    .temp-tag-detail.hidden { display: none; }
    .progress {
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 12px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
    .success-ref {
      display: inline-block;
      background: var(--amber-soft);
      border: 1.5px solid var(--ink);
      color: var(--ink);
      padding: 10px 22px;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 18px 0;
    }
    .pending-badge {
      display: inline-block;
      background: var(--paper-2);
      border: 1.5px solid var(--amber);
      color: var(--amber);
      padding: 8px 16px;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 14px;
    }
    .success-detail {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 10px;
      font-family: 'DM Mono', ui-monospace, monospace;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="loading-state">Loading the form…</div>
  </div>

  <script type="module" src="/apt.js"></script>
</body>
</html>
