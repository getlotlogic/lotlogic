name: Playwright

on:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'BASE_URL to test against (defaults to live beta)'
        required: false

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e + a11y
    # Only a Vercel Preview deploy that actually succeeded gets tested — a
    # Production deployment_status (main, post-merge) is handled by the
    # `push: main` trigger above instead, and a failed/pending deploy has
    # nothing at a URL yet.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # tests/package-lock.json IS tracked (root .gitignore re-includes it via
          # `!tests/package-lock.json`), so enable npm caching keyed on it.
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install deps
        # Strict install from the committed lockfile — a broken/out-of-date
        # lockfile should FAIL, not silently fall back to a floating install.
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Resolve BASE_URL
        id: base
        env:
          # A boolean-as-string, not the secret itself — never echo the value.
          BYPASS_SECRET_SET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          # A Vercel Preview sits behind Deployment Protection (confirmed:
          # it 302s to vercel.com/sso-api without a bypass) — so testing one
          # without VERCEL_AUTOMATION_BYPASS_SECRET set can only either hang
          # on the SSO redirect or, worse, silently pass against nothing.
          # Fail loudly here instead of falling back to production, which
          # would defeat the entire point of Task 18.
          if [ "${{ github.event_name }}" = "deployment_status" ] && [ "$BYPASS_SECRET_SET" != "true" ]; then
            echo "::error::deployment_status fired but the VERCEL_AUTOMATION_BYPASS_SECRET GitHub Actions secret is not set. The Vercel preview is behind Deployment Protection and will redirect to vercel.com/sso-api instead of serving the app. Create the bypass secret in Vercel -> Project -> Settings -> Deployment Protection -> Protection Bypass for Automation, then add it as the VERCEL_AUTOMATION_BYPASS_SECRET GitHub Actions secret." >&2
            exit 1
          fi
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "value=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.deployment_status.environment_url }}" ]; then
            # The preview built from THIS commit. Test the change, not production.
            echo "value=${{ github.event.deployment_status.environment_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.VERCEL_PREVIEW_URL }}" ]; then
            echo "value=${{ secrets.VERCEL_PREVIEW_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=https://lotlogic-beta.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        env:
          BASE_URL: ${{ steps.base.outputs.value }}
          API_URL: ${{ secrets.API_URL || 'https://lotlogic-backend-production.up.railway.app' }}
          TEST_OWNER_A_EMAIL: ${{ secrets.TEST_OWNER_A_EMAIL }}
          TEST_OWNER_A_PASSWORD: ${{ secrets.TEST_OWNER_A_PASSWORD }}
          TEST_OWNER_B_EMAIL: ${{ secrets.TEST_OWNER_B_EMAIL }}
          TEST_OWNER_B_PASSWORD: ${{ secrets.TEST_OWNER_B_PASSWORD }}
          TEST_PARTNER_A_EMAIL: ${{ secrets.TEST_PARTNER_A_EMAIL }}
          TEST_PARTNER_A_PASSWORD: ${{ secrets.TEST_PARTNER_A_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: tests/playwright-report
          retention-days: 14
