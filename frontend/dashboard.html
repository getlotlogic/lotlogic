    .theme-toggle-btn .theme-icon.moon { left: 4px; }
    .theme-toggle-btn .theme-icon.sun { right: 4px; }

    /* ── Offline banner ── */
    .offline-banner {
      position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 0; right: 0;
      z-index: 100; text-align: center; padding: 8px 16px;
      font-size: 12px; font-weight: 700;
      background: rgba(239,68,68,.12); color: #f87171;
      border-bottom: 1px solid rgba(239,68,68,.25);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      animation: slideDown .3s ease;
    }
    .reconnected-banner {
      position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 0; right: 0;
      z-index: 100; text-align: center; padding: 8px 16px;
      font-size: 12px; font-weight: 700;
      background: rgba(74,222,128,.12); color: #4ade80;
      border-bottom: 1px solid rgba(74,222,128,.25);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      animation: slideDown .3s ease;
    }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ── Pull to refresh ── */
    .ptr-spinner {
      text-align: center; padding: 12px 0; transition: all .3s ease;
      overflow: hidden;
    }
    .ptr-spinner .spin { display: inline-block; margin-right: 6px; }

    /* ── Tab page transition ── */
    .page-slide { animation: pageSlide .25s ease both; }
    @keyframes pageSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ── Focus visible (a11y) ── */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:focus:not(:focus-visible) { outline: none; }

    /* ── Skip link (a11y) ── */
    .skip-link {
      position: absolute; top: -100px; left: 16px; z-index: 9999;
      background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 700; text-decoration: none;
      transition: top .2s;
    }
    .skip-link:focus { top: 8px; }

    /* ── Violation snapshot with detections ── */
    .viol-snap-wrap { position: relative; overflow: hidden; background: var(--snapshot-bg); }
    .viol-snap-badge {
      position: absolute; top: 6px; left: 6px; z-index: 1;
      display: flex; align-items: center; gap: 4px;
      background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
      border-radius: 5px; padding: 3px 7px;
      font-size: 9px; font-weight: 700; color: #fff;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .viol-snap-badge .ai-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #4ade80;
      box-shadow: 0 0 4px rgba(74,222,128,.6);
    }

    /* ── Vehicle summary bar (tow operator) ── */
    .vehicle-summary {
      display: flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--bg-inset); border-top: 1px solid var(--border-subtle);
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      overflow-x: auto; white-space: nowrap;
    }
    .vehicle-summary .vs-divider { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
    .vehicle-summary .vs-item { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

    /* ── Last updated indicator ── */
    .last-updated {
      font-size: 10px; font-weight: 600; color: var(--text-ghost);
      text-align: center; padding: 4px 0; margin-bottom: 8px;
    }

    /* ── SC211: Possible no parking pass ── */
    .nreg-row {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    .nreg-row::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
    }
    .nreg-row.nreg-flagged::before   { background: #B14535; }
    .nreg-row.nreg-pending::before   { background: #D97706; }
    .nreg-row.nreg-resolved::before  { background: #4A7A48; }
    .nreg-row.nreg-dismissed::before { background: var(--border); }
    .nreg-snap-strip {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
    }
    .nreg-snap-wrap {
      position: relative; flex-shrink: 0;
      width: 80px; height: 56px;
      border-radius: 6px; overflow: hidden;
      background: var(--snapshot-bg);
      border: 1px solid var(--border-subtle);
    }
    .nreg-snap-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .nreg-snap-badge {
      position: absolute; bottom: 3px; left: 3px;
      background: var(--accent); color: #000;
      font-size: 8px; font-weight: 800;
      padding: 1px 4px; border-radius: 3px;
      letter-spacing: .04em;
    }
    .nreg-snap-time {
      position: absolute; bottom: 3px; right: 3px;
      background: rgba(0,0,0,.65); color: #fff;
      font-size: 8px; font-weight: 600;
      padding: 1px 4px; border-radius: 3px;
    }
    .nreg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .nreg-btn-dismiss {
      padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; border: 1px solid var(--border);
      background: var(--bg-inset); color: var(--text-muted); transition: opacity .15s;
    }
    .nreg-btn-dismiss:active { opacity: .7; }
    .nreg-btn-tow {
      padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; border: 1px solid rgba(239,68,68,.4);
      background: rgba(239,68,68,.12); color: #ef4444; transition: opacity .15s;
    }
    .nreg-btn-tow:active { opacity: .7; }
    .nreg-pill-strength-lingered {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      padding: 2px 8px; border-radius: 20px;
      background: rgba(177,69,53,.15); color: #ef8070; border: 1px solid rgba(177,69,53,.35);
    }
    .nreg-pill-strength-brief {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      padding: 2px 8px; border-radius: 20px;
      background: var(--bg-inset); color: var(--text-muted); border: 1px solid var(--border);
    }
    .nreg-badge-count {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
      background: rgba(177,69,53,.15); color: #ef8070; border: 1px solid rgba(177,69,53,.25);
      margin-left: 6px; white-space: nowrap;
    }
    .theme-light .nreg-btn-dismiss { background: #f3f4f6; border-color: #e5e7eb; color: #6b7280; }
    .theme-light .nreg-pill-strength-brief { background: #f3f4f6; border-color: #e5e7eb; color: #6b7280; }

    /* ── Brand-v2 KPI tiles (lots redesign) ── */
    .kpis-paper{display:grid;grid-template-columns:1fr 1fr}
    .kpis-paper.single{grid-template-columns:1fr}
    .kpi-paper{
      padding:18px 16px 16px;
      border-right:1px solid var(--border-paper);
      border-bottom:1px solid var(--border-paper);
      cursor:pointer;display:block;text-decoration:none;color:inherit;
      background:var(--card-paper);
      transition:background 120ms;position:relative;
    }
    .kpi-paper:nth-child(2n){border-right:none}
    .kpi-paper:nth-last-child(-n+2){border-bottom:none}
    .kpi-paper:active,.kpi-paper:hover{background:#EFE4CA}
    .kpi-paper .top-row{display:flex;align-items:baseline;justify-content:space-between}
    .kpi-paper .val{
      font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;
      font-variant-numeric:tabular-nums;color:var(--ink-paper);
    }
    .kpi-paper .chev{color:var(--ink-4-paper);font-size:18px}
    .kpi-paper .label{margin-top:8px;font-size:12px;font-weight:600;color:var(--ink-3-paper)}
    .kpi-paper.red .val{color:var(--red-paper)}
    .kpi-paper.amber .val{color:var(--amber-paper)}
    .kpi-paper.green .val{color:var(--green-paper)}
    .kpi-paper.calm .val{color:var(--ink-3-paper)}

    /* ── Brand-v2 lot card ── */
    .lot-card-paper{
      background:var(--card-paper);
      border:1px solid var(--border-paper);
      border-radius:14px;overflow:hidden;
      margin-bottom:14px;
      box-shadow:var(--shadow-paper);
    }
    .lot-head-paper{
      padding:16px 18px 14px;
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      border-bottom:1px solid var(--border-paper);
    }
    .lot-name-paper{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink-paper)}
    .lot-addr-paper{font-size:13px;color:var(--ink-3-paper);margin-top:3px;font-weight:500}
    .lot-foot-paper{
      display:flex;border-top:1px solid var(--border-paper);
    }
    .lot-foot-paper button{
      flex:1;padding:14px 12px;text-align:center;background:none;border:none;
      font-size:14px;font-weight:600;color:var(--ink-paper);
      border-right:1px solid var(--border-paper);
      display:flex;align-items:center;justify-content:center;gap:6px;
      cursor:pointer;font-family:inherit;
    }
    .lot-foot-paper button:last-child{border-right:none}
    .lot-foot-paper button:active{background:#EFE4CA}
    .lot-foot-paper .arr{color:var(--ink-3-paper);font-weight:500}
    .lot-pill-paper{
      flex-shrink:0;
      font-size:11px;font-weight:700;letter-spacing:.02em;
      padding:5px 10px;border-radius:999px;
      display:inline-flex;align-items:center;gap:6px;
      white-space:nowrap;
    }
    .lot-pill-paper .dot{width:7px;height:7px;border-radius:50%}
    .lot-pill-paper.red{background:var(--red-bg-paper);color:var(--red-paper)}
    .lot-pill-paper.red .dot{background:var(--red-paper)}
    .lot-pill-paper.amber{background:var(--amber-bg-paper);color:var(--amber-paper)}
    .lot-pill-paper.amber .dot{background:var(--amber-paper)}
    .lot-pill-paper.green{background:var(--green-bg-paper);color:var(--green-paper)}
    .lot-pill-paper.green .dot{background:var(--green-paper)}

    /* ── Brand-v2 drill-down panels ── */
    .drill-paper{
      background:var(--card-paper);
      border:1px solid var(--border-paper);
      border-radius:14px;overflow:hidden;
      box-shadow:var(--shadow-paper);
      margin-bottom:16px;
    }
    .drill-head-paper{
      padding:16px 18px;
      border-bottom:1px solid var(--border-paper);
      display:flex;align-items:center;justify-content:space-between;
    }
    .drill-head-paper .title{font-size:15px;font-weight:700;color:var(--ink-paper)}
    .drill-head-paper .back{
      font-size:13px;color:var(--ink-3-paper);font-weight:600;
      background:none;border:none;cursor:pointer;font-family:inherit;
      display:inline-flex;align-items:center;gap:4px;
    }
    .drill-head-paper .back:active{opacity:.7}

    /* No-reg drill-down rows */
    .nr-row-paper{
      padding:14px 16px 14px 20px;
      border-bottom:1px solid var(--border-paper);
      position:relative;
    }
    .nr-row-paper:last-child{border-bottom:none}
    .nr-row-paper::before{
      content:'';position:absolute;left:0;top:0;bottom:0;
      width:4px;
    }
    .nr-row-paper.stage-flagged::before{background:var(--red-paper)}
    .nr-row-paper.stage-pending::before{background:var(--amber-paper)}
    .nr-row-paper.stage-resolved::before{background:var(--green-paper)}
    .nr-row-paper.stage-dismissed::before{background:var(--ink-4-paper)}
    .nr-row-top-paper{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .plate-tag-paper{
      font-family:ui-monospace,"SF Mono",Menlo,monospace;
      font-size:16px;font-weight:700;letter-spacing:.04em;
      padding:6px 10px;
      background:var(--ink-paper);color:var(--card-paper);border-radius:6px;
    }
    .nr-times-paper{
      font-size:12.5px;color:var(--ink-3-paper);
      display:flex;flex-direction:column;align-items:flex-end;font-weight:500;
      font-variant-numeric:tabular-nums;
    }
    .nr-times-paper .age{color:var(--red-paper);font-weight:700;font-size:14px}
    .nr-meta-paper{
      margin-top:10px;
      font-size:12.5px;color:var(--ink-3-paper);
      display:flex;gap:10px;flex-wrap:wrap;font-weight:500;
    }
    .nr-meta-paper .badge{
      padding:3px 8px;border-radius:999px;background:var(--bg-paper);
      font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink-3-paper);
    }
    .nr-meta-paper .badge.lingered{background:var(--red-bg-paper);color:var(--red-paper)}
    .nr-snaps-paper{
      margin-top:12px;
      display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    }
    /* Phones — 4-up on a 360px screen is ~75px per tile, which is too small
       to read a plate. Go 2-up for thumbs you can actually scan, and bump
       the gap so they don't smear together visually. */
    @media (max-width: 540px){
      .nr-snaps-paper{grid-template-columns:repeat(2,1fr);gap:10px}
    }
    .nr-snap-paper{
      aspect-ratio:4/3;border-radius:8px;background:#0a0a0b;
      position:relative;overflow:hidden;
      background-image:repeating-linear-gradient(45deg,#1a1a1c,#1a1a1c 6px,#0a0a0b 6px,#0a0a0b 12px);
      display:flex;align-items:flex-end;
      cursor:zoom-in;
      transition: transform 140ms ease, box-shadow 140ms ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      -webkit-tap-highlight-color: transparent;
    }
    .nr-snap-paper:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
    .nr-snap-paper:active{transform:scale(.97);transition-duration:80ms}
    /* contain (not cover) so the WHOLE frame is visible. Cropping bottom-half
       of a truck lost too many plates at edge of frame. The black letterbox
       background covers the rest. */
    .nr-snap-paper img{
      width:100%;height:100%;object-fit:contain;display:block;
      position:absolute;inset:0;
      animation: snap-fade-in 220ms ease-out;
      will-change: opacity;
    }
    @keyframes snap-fade-in{from{opacity:0}to{opacity:1}}
    .nr-snap-paper .snt{
      width:100%;font-size:10px;font-weight:600;color:#fff;
      background:linear-gradient(transparent,rgba(0,0,0,.82));
      padding:14px 8px 6px;text-align:right;font-variant-numeric:tabular-nums;
      position:relative;z-index:1;letter-spacing:.02em;
    }
    .nr-snap-paper .snc{
      position:absolute;top:6px;left:6px;
      font-size:10px;font-weight:800;color:#fff;
      background:rgba(0,0,0,.62);padding:3px 7px;border-radius:4px;
      font-variant-numeric:tabular-nums;z-index:1;letter-spacing:.02em;
      backdrop-filter: blur(4px);
    }
    .nr-snap-paper.best{outline:2px solid var(--red-paper);outline-offset:-2px}
    .nr-snap-paper.best::after{
      content:'BEST';position:absolute;top:6px;right:6px;
      font-size:9px;font-weight:800;letter-spacing:.08em;
      background:var(--red-paper);color:#fff;padding:3px 6px;border-radius:4px;z-index:1;
      box-shadow:0 1px 4px rgba(0,0,0,.25);
    }
    .nr-actions-paper{
      margin-top:14px;display:flex;gap:8px;
    }
    .btn-paper{
      flex:1;padding:11px 12px;border-radius:8px;
      font-size:14px;font-weight:700;
      text-align:center;cursor:pointer;
      border:1px solid var(--border-strong-paper);background:var(--card-paper);color:var(--ink-paper);
      font-family:inherit;transition:background 120ms;
    }
    .btn-paper:active{background:#EFE4CA}
    .btn-paper.primary{background:var(--red-paper);color:var(--card-paper);border-color:var(--red-paper)}
    .btn-paper.primary:active{background:#8E3528}

    /* Registered drill-down rows */
    .reg-row-paper{
      padding:13px 16px;border-bottom:1px solid var(--border-paper);
      display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
    }
    .reg-row-paper:last-child{border-bottom:none}
    .reg-name-paper{font-size:15px;font-weight:600;color:var(--ink-paper)}
    .reg-detail-paper{font-size:12.5px;color:var(--ink-3-paper);margin-top:2px;font-weight:500}
    .reg-time-paper{
      font-size:12px;color:var(--ink-3-paper);text-align:right;font-weight:500;
      font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:2px;
    }
    .reg-live-paper{color:var(--green-paper);font-weight:700;font-size:11px;letter-spacing:.04em}

    /* ── Brand-v2 filter pills (All Jobs) ── */
    .filter-bar-paper{
      display:flex;gap:6px;padding:14px 0 4px;overflow-x:auto;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .filter-bar-paper::-webkit-scrollbar{display:none}
    .filter-pill-paper{
      flex-shrink:0;padding:7px 13px;border-radius:999px;
      font-size:13px;font-weight:600;letter-spacing:-.005em;
      border:1px solid var(--border-strong-paper);background:var(--card-paper);color:var(--ink-2-paper);
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      white-space:nowrap;font-family:inherit;transition:background 120ms,color 120ms;
    }
    .filter-pill-paper:active{background:#EFE4CA}
    .filter-pill-paper.active{background:var(--ink-paper);color:var(--card-paper);border-color:var(--ink-paper)}
    .filter-pill-paper .n{
      font-variant-numeric:tabular-nums;
      font-size:11.5px;padding:1px 6px;border-radius:999px;
      background:var(--bg-paper);color:var(--ink-3-paper);font-weight:700;
    }
    .filter-pill-paper.active .n{background:rgba(250,245,232,.18);color:var(--card-paper)}

    /* ── Brand-v2 job rows (All Jobs) ── */
    .job-row-paper{
      background:var(--card-paper);border:1px solid var(--border-paper);border-radius:12px;
      padding:14px 14px 12px 18px;margin-bottom:10px;box-shadow:var(--shadow-paper);
      position:relative;cursor:pointer;
    }
    .job-row-paper::before{
      content:'';position:absolute;left:0;top:8px;bottom:8px;
      width:4px;border-radius:0 4px 4px 0;background:var(--ink-4-paper);
    }
    .job-row-paper.stage-flagged::before{background:var(--red-paper)}
    .job-row-paper.stage-pending::before{background:var(--amber-paper)}
    .job-row-paper.stage-resolved::before,.job-row-paper.stage-handled::before{background:var(--green-paper)}
    .job-row-paper.stage-dismissed::before{background:var(--ink-4-paper)}
    .job-row-paper:active{background:#F4ECD7}
    .jr-top-paper{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .jr-type-paper{
      font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      padding:3px 8px;border-radius:999px;
    }
    .jr-type-paper.nreg{background:var(--red-bg-paper);color:var(--red-paper)}
    .jr-type-paper.over{background:var(--amber-bg-paper);color:var(--amber-paper)}
    .jr-type-paper.viol{background:var(--amber-bg-paper);color:var(--amber-paper)}
    .jr-type-paper.done{background:var(--green-bg-paper);color:var(--green-paper)}
    .jr-stage-paper{
      font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-left:8px;color:var(--ink-3-paper);font-variant-numeric:tabular-nums;
    }
    .job-row-paper.stage-flagged .jr-stage-paper{color:var(--red-paper)}
    .job-row-paper.stage-pending .jr-stage-paper{color:var(--amber-paper)}
    .job-row-paper.stage-resolved .jr-stage-paper,.job-row-paper.stage-handled .jr-stage-paper{color:var(--green-paper)}
    .jr-age-paper{
      font-size:13px;font-weight:700;color:var(--ink-3-paper);font-variant-numeric:tabular-nums;
      display:flex;align-items:center;gap:2px;
    }
    .jr-age-paper.urgent{color:var(--red-paper)}
    .jr-chev-paper{
      color:var(--ink-3-paper);font-size:18px;line-height:1;
      transition:transform 200ms ease;display:inline-block;margin-left:4px;
    }
    .jr-mid-paper{display:flex;align-items:center;gap:10px;margin-top:11px}
    .jr-mid-paper .where{
      font-size:14px;font-weight:600;color:var(--ink-paper);letter-spacing:-.005em;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .jr-bot-paper{
      margin-top:9px;font-size:12.5px;color:var(--ink-3-paper);font-weight:500;
      display:flex;gap:10px;flex-wrap:wrap;
    }
    .jr-bot-paper .sep{color:var(--border-strong-paper)}
    .jr-expand-paper{
      overflow:hidden;max-height:0;
      transition:max-height 260ms ease;
      border-top:0 solid transparent;
    }
    .job-row-paper.open .jr-expand-paper{
      max-height:600px;border-top:1px solid var(--border-paper);
      margin-top:12px;padding-top:12px;
    }
    .jr-snaps-paper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
    .jr-actions-paper{display:flex;gap:8px;margin-bottom:8px}
    .jr-actions-paper .btn-paper{font-size:13.5px;padding:10px 12px}
    .jr-kv-paper{
      display:grid;grid-template-columns:auto 1fr;gap:6px 14px;
      font-size:13px;font-weight:500;color:var(--ink-2-paper);margin-bottom:12px;
    }
    .jr-kv-paper dt{color:var(--ink-3-paper);font-weight:600}
    .jr-kv-paper dd{color:var(--ink-paper);font-variant-numeric:tabular-nums}
  </style>
